spring.application.name=employee-management

server.port=5000

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=3600000

elasticsearch.url=${ELASTICSEARCH_URL:http://localhost:9200}
elasticsearch.index.employees=${ELASTICSEARCH_EMPLOYEES_INDEX:employees_app}
elasticsearch.index.users=${ELASTICSEARCH_USERS_INDEX:users}
elasticsearch.index.user_emails=${ELASTICSEARCH_USER_EMAILS_INDEX:user_emails}
elasticsearch.index.mutation_journal=${ELASTICSEARCH_JOURNAL_INDEX:mutation_journal}
elasticsearch.enabled=${ELASTICSEARCH_ENABLED:true}
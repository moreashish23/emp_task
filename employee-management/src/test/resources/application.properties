spring.application.name=employee-management-test
server.port=5000

# Test DataSource (H2 in MySQL mode)
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT Configuration
app.jwt.secret=${JWT_SECRET:dGhpc2lzYXZlcnlzZWNyZXRqd3RrZXlmb3JlbXBsb3llZW1hbmFnZW1lbnRzeXN0ZW0xMjM0NQ==}
app.jwt.expiration=3600000

# Elasticsearch Search Index Configuration
elasticsearch.url=${ELASTICSEARCH_URL:http://localhost:9200}
elasticsearch.index.employees=test_employees_search
elasticsearch.index.users=test_users
elasticsearch.index.user_emails=test_user_emails
elasticsearch.index.mutation_journal=test_mutation_journal
elasticsearch.enabled=true
